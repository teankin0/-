.phone { font-size:14px; color:var(--cyan); margin:0 0 16px; letter-spacing:1px; }

.sent { border-top:1px dashed var(--line); padding-top:12px; font-size:14px; }
.sent-en { margin:0 0 4px; color:#fff; }

.menu { display:flex; flex-direction:column; gap:12px; }
.btn { display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:15px 18px; border-radius:0; border:1px solid var(--line); background:var(--card);
  color:var(--txt); font-size:15px; cursor:pointer; text-align:left; width:100%;
  clip-path:polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
  transition:background .15s; }
.btn:hover { background:#2c2c2c; }
.btn:active { border-color:var(--brand); }
.btn.primary { background:var(--brand); border-color:var(--brand); color:#111; font-weight:700;
  justify-content:center; font-size:16px; letter-spacing:3px; }
.btn.primary:hover { background:#ffd83a; }
.btn:disabled { opacity:.35; cursor:not-allowed; }
.count { font-size:13px; color:var(--cyan); letter-spacing:1px; }
.btn.primary .count { color:rgba(0,0,0,.65); }
.top { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.sub { font-size:13px; color:var(--sub); letter-spacing:1px; }
.back { border:none; background:none; color:var(--cyan); font-size:14px; cursor:pointer;
  padding:4px 8px; letter-spacing:1px; }
.done { text-align:center; padding:56px 0; color:var(--sub); letter-spacing:2px; }
.list { background:var(--card); border:1px solid var(--line); border-radius:0; overflow:hidden; }
.row { display:flex; gap:12px; align-items:baseline; padding:10px 14px;
  border-bottom:1px solid var(--line); font-size:14px; }
.row:last-child { border-bottom:none; }
.row:hover { background:#2a2a2a; }
.rw { min-width:120px; font-weight:600; flex:none; color:#fff;
  font-family:Consolas,"Segoe UI",monospace; }
.rt { color:var(--sub); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.undo { border:none; background:none; color:var(--warn); font-size:12px; cursor:pointer;
  flex:none; padding:2px 6px; }
.empty { text-align:center; color:var(--sub); padding:44px 0; letter-spacing:2px; }
.io { display:flex; gap:8px; margin:10px 0; }
.io button { padding:6px 14px; border-radius:0; border:1px solid var(--line);
  background:var(--card); color:var(--txt); font-size:13px; cursor:pointer; }
.io button:hover { border-color:var(--brand); color:var(--brand); }
.io textarea { flex:1; min-height:60px; border-radius:0; border:1px solid var(--line);
  background:var(--dark); color:var(--txt); font-size:12px; padding:8px; resize:vertical;
  font-family:Consolas,monospace; }
.msg { font-size:13px; color:var(--sub); margin:0 0 8px; }
</style>

<script>
(function () {
  var WORDS = window.KV_WORDS || [];
  var STORE_KEY = 'kaoyan.passed.v1';
  var app = document.getElementById('app');
  var passed = load();
  var view = 'home';
  var current = null;
  var ioOpen = false, ioText = '', ioMsg = '';
  var online = location.protocol === 'http:' || location.protocol === 'https:';

  function load() {
    try { var r = JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); return new Set(Array.isArray(r) ? r : []); }
    catch (e) { return new Set(); }
  }
  var dirty = false;
  function save(sync) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(Array.from(passed))); } catch (e) {}
    if (sync !== false && online) pushToServer();
    else if (online === false) dirty = true;
  }
  function pushToServer() {
    if (!online) { dirty = true; return; }
    fetch('/api/progress', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ passed: Array.from(passed) }) })
      .then(function (r) { dirty = r.ok ? false : true; })
      .catch(function () { dirty = true; });
  }
  // 双向合并：手机本地进度 ∪ 服务器进度，谁都不覆盖谁
  function syncMerge() {
    if (!online) { dirty = true; return; }
    fetch('/api/progress').then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
      if (!j || !Array.isArray(j.passed)) { if (dirty) pushToServer(); return; }
      var changed = false;
      j.passed.forEach(function (x) {
        if (typeof x === 'string' && !passed.has(x)) { passed.add(x); changed = true; }
      });
      if (changed) { dirty = true; save(); render(); }
      else if (dirty) pushToServer();
    }).catch(function () { dirty = true; });
  }
  // 断网时背的单词，恢复联网后自动补同步
  window.addEventListener('online', syncMerge);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) syncMerge(); });
  setInterval(function () { if (dirty) pushToServer(); }, 30000);

  function leftList() { return WORDS.filter(function (w) { return !passed.has(w.w); }); }
  function passedList() { return WORDS.filter(function (w) { return passed.has(w.w); }); }
  function nextWord(pool) {
    var p = pool || leftList();
    return p.length ? p[Math.floor(Math.random() * p.length)] : null;
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function markPassed() {
    if (!current) return;
    passed.add(current.w); save();
    current = nextWord(leftList()); render();
  }
  function undoWord(w) { passed.delete(w); save(); render(); }
  function doExport() {
    ioText = JSON.stringify(Array.from(passed));
    ioMsg = '已生成进度代码，长按全选复制保存';
    render();
  }
  function doImport() {
    try {
      var arr = JSON.parse(ioText);
      if (!Array.isArray(arr)) throw new Error('bad');
      passed = new Set(arr.filter(function (x) { return typeof x === 'string'; }));
      save(); ioOpen = false; ioMsg = ''; render();
    } catch (e) { ioMsg = '进度代码无效，未做任何修改'; render(); }
  }

  function render() {
    var html = '';
    if (view === 'home') {
      html += '<h1>考研单词</h1><div class="hazard"></div><div class="menu">';
      html += '<button class="btn" data-a="passed"><span>已过单词</span><span class="count">' + passedList().length + ' 个</span></button>';
      html += '<button class="btn" data-a="left"><span>未过单词</span><span class="count">' + leftList().length + ' 个</span></button>';
      html += '<button class="btn primary" data-a="start"' + (leftList().length ? '' : ' disabled') +
        '><span>开始</span>' + (leftList().length ? '<span class="count">剩余 ' + leftList().length + '</span>' : '') + '</button>';
      html += '</div>';
    } else if (view === 'study') {
      if (!current) {
        html += '<div class="top"><button class="back" data-a="home">← 返回</button></div>';
        html += '<div class="done">全部单词已过完！</div>';
      } else {
        html += '<div class="top"><button class="back" data-a="home">← 返回</button>' +
          '<span class="sub">进度 ' + passedList().length + ' / ' + WORDS.length + '</span></div>';
        html += '<div class="card"><h1 class="word">' + esc(current.w) + '</h1>';
        if (current.p) html += '<div class="phone">/' + esc(current.p) + '/</div>';
        html += '<ul class="trans">' + current.t.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>';
        if (current.s) html += '<div class="sent"><p class="sent-en">' + esc(current.s.s) + '</p><p class="sent-cn">' + esc(current.s.c) + '</p></div>';
        html += '</div><button class="btn primary" data-a="pass">过</button>';
      }
    } else {
      var isPassed = view === 'passed';
      var list = isPassed ? passedList() : leftList();
      html += '<div class="top"><button class="back" data-a="home">← 返回</button>' +
        '<span class="sub">' + (isPassed ? '已过 ' : '剩余 ') + list.length + ' 个</span></div>';
      if (isPassed) {
        html += '<div class="io"><button data-a="export">导出进度</button><button data-a="toggle-io">导入进度</button></div>';
        if (ioOpen) html += '<div class="io"><textarea id="io-ta" placeholder="粘贴进度代码">' + esc(ioText) + '</textarea><button data-a="import">应用导入</button></div>';
        if (ioMsg) html += '<p class="msg">' + esc(ioMsg) + '</p>';
      }
      if (!list.length) {
        html += '<div class="empty">这里还没有单词</div>';
      } else {
        html += '<div class="list">' + list.map(function (w) {
          return '<div class="row"><span class="rw">' + esc(w.w) + '</span><span class="rt">' + esc(w.t.join('；')) + '</span>' +
            (isPassed ? '<button class="undo" data-undo="' + esc(w.w) + '">撤销</button>' : '') + '</div>';
        }).join('') + '</div>';
      }
    }
    app.innerHTML = html;
    var ta = document.getElementById('io-ta');
    if (ta) ta.addEventListener('input', function () { ioText = ta.value; });
  }

  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-a],[data-undo]');
    if (!b) return;
    if (b.dataset.undo !== undefined && b.dataset.undo !== '') { undoWord(b.dataset.undo); return; }
    var a = b.dataset.a;
    if (a === 'passed' || a === 'left') { view = a; ioOpen = false; ioMsg = ''; }
    else if (a === 'home') view = 'home';
    else if (a === 'start') { current = nextWord(); view = 'study'; }
    else if (a === 'pass') { markPassed(); return; }
    else if (a === 'export') { doExport(); return; }
    else if (a === 'toggle-io') { ioOpen = !ioOpen; ioMsg = ''; }
    else if (a === 'import') { doImport(); return; }
    render();
  });

  if ('serviceWorker' in navigator && online) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
  render();
  syncMerge();
})();
</script>
</body>
</html>
